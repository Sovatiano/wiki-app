version: '3.8'

services:
  # База данных PostgreSQL
  db:
    image: postgres:15-alpine
    container_name: wiki-app-db-dev
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 112233
      POSTGRES_DB: wikiapp
    volumes:
      - postgres_data_dev:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Серверная часть (FastAPI) с hot-reload
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: wiki-app-server-dev
    environment:
      DATABASE_URL: postgresql://postgres:112233@db:5432/wikiapp
      SECRET_KEY: your-secret-key-here-change-in-production
      CORS_ORIGINS: http://localhost:3000,http://localhost:80,http://127.0.0.1:3000,http://127.0.0.1:80
      DEBUG: "True"
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./server:/app
    # Hot-reload для разработки
    command: >
      sh -c "
        echo 'Waiting for database...' &&
        sleep 5 &&
        alembic upgrade head &&
        uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
      "
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Клиентская часть (React) с hot-reload через Vite dev server
  client:
    build:
      context: ./client
      dockerfile: Dockerfile.dev
    container_name: wiki-app-client-dev
    ports:
      - "3000:3000"
    depends_on:
      - server
    volumes:
      - ./client:/app
      - /app/node_modules
    environment:
      - VITE_API_URL=http://localhost:8000

volumes:
  postgres_data_dev:
